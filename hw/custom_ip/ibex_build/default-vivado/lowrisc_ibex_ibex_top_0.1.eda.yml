hooks:
  pre_build: []
name: lowrisc_ibex_ibex_top_0.1
parameters:
  BaseIsa:
    datatype: str
    default: ibex_pkg::BaseIsaRV32I
    description: Base ISA parameter enum. See the ibex_pkg::base_isa_e enum in ibex_pkg.sv
      for permitted values.
    paramtype: vlogdefine
  BranchPredictor:
    datatype: int
    default: 0
    description: Enables static branch prediction (EXPERIMENTAL)
    paramtype: vlogparam
  BranchTargetALU:
    datatype: int
    default: 1
    description: Enables separate branch target ALU (increasing branch performance
      EXPERIMENTAL) [0/1]
    paramtype: vlogparam
  DbgTriggerEn:
    datatype: int
    default: 0
    description: 'Enable support for debug triggers. '
    paramtype: vlogparam
  FPGA_XILINX:
    datatype: bool
    default: true
    description: Identifies Xilinx FPGA targets to set DSP pragmas for performance
      counters.
    paramtype: vlogdefine
  ICache:
    datatype: int
    default: 0
    description: Enable instruction cache
    paramtype: vlogparam
  ICacheECC:
    datatype: int
    default: 0
    description: Enable ECC protection in instruction cache
    paramtype: vlogparam
  ICacheScramble:
    datatype: int
    default: 0
    description: Enables ICache scrambling feature (EXPERIMENTAL) [0/1]
    paramtype: vlogparam
  MHPMCounterNum:
    datatype: int
    default: 0
    description: Number of performance monitor event counters [0/29]
    paramtype: vlogparam
  MHPMCounterWidth:
    datatype: int
    default: 40
    description: Bit width of performance monitor event counters [32/64]
    paramtype: vlogparam
  PMPEnable:
    datatype: int
    default: 0
    description: Enable PMP
    paramtype: vlogparam
  PMPGranularity:
    datatype: int
    default: 0
    description: Granularity of NAPOT range, 0 = 4 byte, 1 = 8 byte, 2 = 16 byte,
      3 = 32 byte etc
    paramtype: vlogparam
  PMPNumRegions:
    datatype: int
    default: 4
    description: Number of PMP regions
    paramtype: vlogparam
  RV32B:
    datatype: str
    default: ibex_pkg::RV32BNone
    description: Bitmanip implementation parameter enum. See the ibex_pkg::rv32b_e
      enum in ibex_pkg.sv for permitted values.
    paramtype: vlogdefine
  RV32E:
    datatype: int
    default: 0
    paramtype: vlogparam
  RV32M:
    datatype: str
    default: ibex_pkg::RV32MSingleCycle
    description: RV32M implementation parameter enum. See the ibex_pkg::rv32m_e enum
      in ibex_pkg.sv for permitted values.
    paramtype: vlogdefine
  RV32ZC:
    datatype: str
    default: ibex_pkg::RV32ZcaZcbZcmp
    description: Compressed instructions parameter enum. See the ibex_pkg::rv32zc_e
      enum in ibex_pkg.sv for permitted values.
    paramtype: vlogdefine
  RegFile:
    datatype: str
    default: ibex_pkg::RegFileFF
    description: Register file implementation parameter enum. See the ibex_pkg::regfile_e
      enum in ibex_pkg.sv for permitted values.
    paramtype: vlogdefine
  SecureIbex:
    datatype: int
    default: 0
    description: Enables security hardening features (EXPERIMENTAL) [0/1]
    paramtype: vlogparam
  WritebackStage:
    datatype: int
    default: 1
    description: Enables third pipeline stage (EXPERIMENTAL) [0/1]
    paramtype: vlogparam
tool_options:
  vivado: {}
toplevel: ibex_top
version: 0.2.1
vpi: []
